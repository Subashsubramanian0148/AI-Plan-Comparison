<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive CORE AI Plan Comparison prototype. Demonstration data only." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
    <!-- Font Awesome: Pro kit when VITE_FA_KIT is set (see .env.example), free FA6 otherwise -->
    <script>
      var kit = '%VITE_FA_KIT%';
      if (kit && kit.charAt(0) !== '%') {
        var s = document.createElement('script'); s.src = 'https://kit.fontawesome.com/%VITE_FA_KIT%.js'; s.crossOrigin = 'anonymous'; document.head.appendChild(s);
      } else {
        var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css'; document.head.appendChild(l);
      }
    </script>
    <title>AI Plan Comparison · CORE</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
